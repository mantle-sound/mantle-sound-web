[model]
name = Blog Post
label = {{ this.title }}
hidden = yes

[fields.title]
label = Title
type = string
size = large

[fields.subtitle]
label = Subtitle
type = string
size = large

[fields.language]
label = Lang
type = string
size = large

[fields.author]
label = Author
type = string
width = 1/2

[fields.mastodon_handle]
label = Mastodon Handle
type = string
width = 1/4
addon_label = @

[fields.pub_date]
label = Publication date
type = date
width = 1/4

[fields.updated]
label = Last updated
type = date
width = 1/4
description = Set when a post is revised after publication. Leave empty if it has not been.

[fields.body]
label = Body
type = markdown
