[model]
name = Research Post
label = {{ this.title }}
hidden = yes

[fields.title]
label = Title
type = string
size = large

[fields.subtitle]
label = Subtitle
type = string
size = large

[fields.tag]
label = Tag
type = string
size = 1/4

[fields.tag_2]
label = Tag
type = string
size = 1/4

[fields.language]
label = Lang
type = string
size = large

[fields.author]
label = Author
type = string
width = 1/2

[fields.twitter_handle]
label = Twitter Handle
type = string
width = 1/4
addon_label = @

[fields.pub_date]
label = Publication date
type = date
width = 1/4

[fields.excerpt]
label = Excerpt
type = text

[fields.body]
label = Body
type = markdown
