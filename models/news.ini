[model]
name = News
label = News
hidden = yes

[fields.title]
label = Title
type = string

[fields.has_rss]
label = Has RSS
type = boolean
default = true

[fields.updated]
label = Updated
type = date

[children]
model = news-post
order_by = -pub_date, title

[pagination]
enabled = yes
per_page = 10
