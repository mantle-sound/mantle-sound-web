<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAN mascot brand pack preview</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="brand-mascot.css">
<body class="mascot-brand-preview">
  <main>
    <h1>MAN mascot brand pack</h1>
    <p class="lead">Exports from <code>content/man.png</code>. See <a href="BRAND.md">BRAND.md</a> for usage.</p>

    <section>
      <h2>Line art on transparent</h2>
      <div class="mascot-grid">
        <figure class="mascot-swatch mascot-swatch--dark"><img src="png/mascot-line-white-transparent.png" alt="White lines"><figcaption>White</figcaption></figure>
        <figure class="mascot-swatch mascot-swatch--light"><img src="png/mascot-line-black-transparent.png" alt="Black lines"><figcaption>Black</figcaption></figure>
        <figure class="mascot-swatch mascot-swatch--light"><img src="png/mascot-line-gray-333333-transparent.png" alt="Gray 333"><figcaption>#333</figcaption></figure>
        <figure class="mascot-swatch mascot-swatch--light"><img src="png/mascot-line-gray-666666-transparent.png" alt="Gray 666"><figcaption>#666</figcaption></figure>
        <figure class="mascot-swatch mascot-swatch--light"><img src="png/mascot-line-gray-999999-transparent.png" alt="Gray 999"><figcaption>#999</figcaption></figure>
        <figure class="mascot-swatch mascot-swatch--light"><img src="png/mascot-line-orange-transparent.png" alt="Orange lines"><figcaption>Accent</figcaption></figure>
      </div>
    </section>

    <section>
      <h2>Bold lines (small line-art only)</h2>
      <div class="mascot-grid mascot-grid--compact">
        <figure class="mascot-swatch mascot-swatch--dark"><img src="png/mascot-silhouette-white-bold-transparent.png" alt="Bold white"><figcaption>Bold white</figcaption></figure>
        <figure class="mascot-swatch mascot-swatch--light"><img src="png/mascot-silhouette-black-bold-transparent.png" alt="Bold black"><figcaption>Bold black</figcaption></figure>
        <figure class="mascot-swatch mascot-swatch--dark"><img src="png/mascot-line-white-transparent-128.png" alt="128px white"><figcaption>128 px</figcaption></figure>
        <figure class="mascot-swatch mascot-swatch--light"><img src="png/mascot-line-black-transparent-128.png" alt="128px black"><figcaption>128 px</figcaption></figure>
      </div>
    </section>

    <section>
      <h2>Plates</h2>
      <div class="mascot-grid mascot-grid--plates">
        <figure><img src="png/mascot-plate-black-bg-white-line.png" alt="Black plate"><figcaption>Black plate</figcaption></figure>
        <figure><img src="png/mascot-plate-white-bg-black-line.png" alt="White plate"><figcaption>White plate</figcaption></figure>
        <figure class="mascot-swatch mascot-swatch--dark"><img src="png/mascot-plate-black-bg-gray-line.png" alt="Gray on black"><figcaption>Gray on black</figcaption></figure>
      </div>
    </section>

    <section>
      <h2>Social &amp; avatar</h2>
      <div class="mascot-grid mascot-grid--social">
        <figure><img src="png/mascot-social-black-1200.png" alt="Social black 1200"><figcaption>1200 social (dark)</figcaption></figure>
        <figure><img src="png/mascot-social-white-1200.png" alt="Social white 1200"><figcaption>1200 social (light)</figcaption></figure>
        <figure><img src="png/mascot-avatar-black-512.png" alt="Avatar black"><figcaption>512 avatar</figcaption></figure>
        <figure><img src="png/mascot-avatar-white-512.png" alt="Avatar white"><figcaption>512 avatar (light)</figcaption></figure>
      </div>
    </section>

    <section>
      <h2>Mirror (scroll direction)</h2>
      <div class="mascot-grid mascot-grid--compact">
        <figure class="mascot-swatch mascot-swatch--dark"><img src="png/mascot-line-white-transparent-mirror.png" alt="Mirror white"><figcaption>Mirror white</figcaption></figure>
        <figure class="mascot-swatch mascot-swatch--light"><img src="png/mascot-line-black-transparent-mirror.png" alt="Mirror black"><figcaption>Mirror black</figcaption></figure>
      </div>
    </section>

    <section class="mascot-watermark-demo">
      <h2>Watermark</h2>
      <div class="mascot-watermark-demo__dark">
        <img class="mascot-watermark" src="png/mascot-watermark-white-22.png" alt="">
        <p>Dark field with 22% white watermark</p>
      </div>
      <div class="mascot-watermark-demo__light">
        <img class="mascot-watermark" src="png/mascot-watermark-black-18.png" alt="">
        <p>Light field with 18% black watermark</p>
      </div>
    </section>
  </main>
</body>
