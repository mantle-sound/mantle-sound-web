{% macro menu() %}
          <a href="/" class="first">Home</a>
          <a href="/software">Software</a>
          <a href="/news">News</a>
          <a href="https://prod.mantle-sound.org/">Mantle Prod.</a>
          <a href="/about">About</a>
          <a href="/contact">Contact</a>
          <hr class="footer-menu__divider">
          <div class="footer-menu__social">
            {% for platform in bag('social-media') %}
              {% if platform != 'order' and bag('social-media', platform + '.display') == 'true' %}
                <a{% if bag('social-media', platform + '.rel') %} rel="{{ bag('social-media', platform + '.rel') }}"{% endif %} href="{% if platform == 'rss' %}{{ '/news/feed.xml'|url }}{% else %}{{ bag('social-media', platform + '.url') }}{% endif %}"{% if platform == 'rss' %} type="application/atom+xml"{% endif %}>
                  <img src="{{ bag('social-media', platform + '.icon') }}" alt="{{ bag('social-media', platform + '.name') }}" class="social-media-icon social-media-icon--footer">
                </a>
              {% endif %}
            {% endfor %}
          </div>
{% endmacro %}
